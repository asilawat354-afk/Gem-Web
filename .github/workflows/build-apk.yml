name: Build APK
on:
  workflow_dispatch:
    inputs:
      url:
        default: "https://gemini.google.com/gem/583ddd73084d/7dbcdb5d114871bf"
      name:
        default: "Gemini"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4
      - name: Create project
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.name }}
        run: |
          mkdir -p app/src/main/java/com/webapp/app app/src/main/res/values
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.webapp.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.webapp.app'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="@string/app_name"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/webapp/app/MainActivity.java <<'EOF'
          package com.webapp.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.getSettings().setDomStorageEnabled(true);
              w.setWebViewClient(new WebViewClient());
              setContentView(w);
              w.loadUrl(getString(R.string.url));
            }
            @Override public void onBackPressed() {
              if (w.canGoBack()) w.goBack(); else super.onBackPressed();
            }
          }
          EOF
          printf '<resources>\n<string name="app_name">%s</string>\n<string name="url">%s</string>\n</resources>\n' "$APP_NAME" "$APP_URL" > app/src/main/res/values/strings.xml
        - name: Build
        run: |
          for i in 1 2 3 4; do
            gradle assembleDebug --no-daemon && exit 0
            echo "Retry $i after wait..."
            sleep 60
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
